<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detector de Contenido AI - DECOPY AI</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#4361ee',
                        secondary: '#3a0ca3',
                        accent: '#7209b7',
                        light: '#f8f9fa',
                        dark: '#212529'
                    }
                }
            }
        }
    </script>

    <style>
        .step-item { transition: all 0.5s ease; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        #steps-container { scroll-behavior: smooth; }
    </style>
</head>

<body class="bg-gray-50 font-[Poppins]">

    <nav class="bg-white shadow-md py-4 relative z-10">
        <div class="container mx-auto px-4 flex justify-between items-center">
            <a href="{{ url_for('home') }}" class="flex items-center">
                <div class="bg-primary p-2 rounded-lg mr-3">
                    <i class="fas fa-robot text-white text-2xl"></i>
                </div>
                <span class="text-xl font-bold text-dark">DECOPY <span class="text-primary">AI</span></span>
            </a>
            <div class="flex items-center gap-4">
                <a href="{{ url_for('ai_detector_bp.ai_detector_page') }}" class="text-primary font-medium">Detector de IA</a>
            </div>
        </div>
    </nav>

    <section class="py-20 md:py-24 relative z-0">
        <div class="container mx-auto px-4">
            <div class="max-w-3xl mx-auto bg-white p-8 md:p-12 rounded-xl shadow-lg">
                <div class="text-center">
                    <h1 class="text-3xl md:text-4xl font-bold text-dark mb-4">Detector de Contenido AI</h1>
                    <p class="text-lg text-gray-600 mb-8">
                        Analiza un documento para determinar si fue escrito por un humano o una IA.
                    </p>
                </div>

                <form id="aiForm" action="/ai-detect" method="post" enctype="multipart/form-data">
                    <label for="documento"
                        class="flex flex-col items-center justify-center w-full h-56 border-2 border-primary border-dashed rounded-lg cursor-pointer bg-light hover:bg-gray-100 transition relative">
                        
                        <div class="flex flex-col items-center justify-center pt-5 pb-6">
                            <i class="fas fa-cloud-upload-alt text-primary text-4xl mb-4"></i>
                            <p class="mb-2 text-sm text-gray-500"><span class="font-semibold">Haz clic para subir</span>
                                o arrastra y suelta</p>
                            <p class="text-xs text-gray-500">Archivos .txt, .pdf, .docx</p>
                            <p id="file-name" class="text-sm text-accent font-bold mt-2 text-center px-4"></p>
                        </div>
                        <input type="file" id="documento" name="documento" class="hidden" accept=".txt,.pdf,.docx" />
                    </label>

                    <button type="submit"
                        class="w-full bg-primary hover:bg-secondary text-white font-bold py-3 px-6 rounded-lg transition duration-300 mt-6 text-lg shadow-lg hover:shadow-xl transform hover:-translate-y-1">
                        <i class="fas fa-search mr-2"></i> Analizar Texto
                    </button>
                </form>
            </div>
        </div>
    </section>

    <div id="process-overlay" class="fixed inset-0 bg-dark/90 z-50 hidden flex-col justify-center items-center backdrop-blur-sm transition-opacity duration-300 opacity-0">
        
        <div class="bg-white w-full max-w-md rounded-2xl shadow-2xl overflow-hidden transform scale-95 transition-transform duration-300" id="process-card">
            
            <div class="bg-gray-50 px-6 py-4 border-b border-gray-100 flex justify-between items-center">
                <div>
                    <h3 id="process-title" class="text-lg font-bold text-dark">Iniciando Motores...</h3>
                    <p class="text-xs text-gray-500">Por favor no cierres esta ventana</p>
                </div>
                <div class="h-8 w-8 rounded-full bg-blue-50 flex items-center justify-center">
                    <i class="fas fa-cog fa-spin text-primary"></i>
                </div>
            </div>

            <div class="relative h-64 bg-white">
                <div class="absolute top-0 left-0 w-full h-8 bg-gradient-to-b from-white to-transparent z-10"></div>
                
                <div id="steps-container" class="h-full overflow-y-hidden px-6 py-4 flex flex-col gap-4 no-scrollbar">
                    </div>

                <div class="absolute bottom-0 left-0 w-full h-12 bg-gradient-to-t from-white to-transparent z-10"></div>
            </div>

            <div class="px-6 py-4 bg-gray-50 border-t border-gray-100">
                <div class="w-full bg-gray-200 rounded-full h-2.5 mb-2">
                    <div id="progress-bar" class="bg-primary h-2.5 rounded-full transition-all duration-300" style="width: 0%"></div>
                </div>
                <div class="flex justify-between text-xs text-gray-500 font-medium">
                    <span id="progress-text">Preparando...</span>
                    <span id="progress-percent">0%</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const form = document.getElementById('aiForm');
            const fileInput = document.getElementById('documento');
            const fileNameDisplay = document.getElementById('file-name');
            
            const overlay = document.getElementById('process-overlay');
            const processCard = document.getElementById('process-card');
            const stepsContainer = document.getElementById('steps-container');
            const progressBar = document.getElementById('progress-bar');
            const progressPercent = document.getElementById('progress-percent');
            const progressText = document.getElementById('progress-text');
            const processTitle = document.getElementById('process-title');

            // 1. Mostrar nombre del archivo
            fileInput.addEventListener('change', function () {
                if (this.files && this.files.length > 0) {
                    fileNameDisplay.textContent = this.files[0].name;
                    this.parentElement.classList.add('border-accent', 'bg-purple-50');
                    this.parentElement.classList.remove('border-primary');
                } else {
                    fileNameDisplay.textContent = '';
                }
            });

            // Variable de control global para saber si el servidor terminó
            let isServerDone = false;
            let finalHtmlContent = "";

            // DEFINICIÓN DE PASOS 
            const steps = [
                { phase: "Fase 1/2: Modelo TF-IDF + LightGBM", title: "Cargando corpus de lenguaje...", duration: 3000 },
                { phase: "Fase 1/2: Modelo TF-IDF + LightGBM", title: "Vectorizando texto (TF-IDF)...", duration: 10000 },
                { phase: "Fase 1/2: Modelo TF-IDF + LightGBM", title: "Ejecutando LightGBM Base...", duration: 20000 },
                { phase: "Fase 1/2: Modelo TF-IDF + LightGBM", title: "Validando vectores dispersos...", duration: 10000 },
                { phase: "Fase 2/2: Feature Engineering & AI", title: "Extrayendo rasgos estilométricos...", duration: 20000 },
                { phase: "Fase 2/2: Feature Engineering & AI", title: "Calculando perplejidad y burstiness...", duration: 30000 },
                { phase: "Fase 2/2: Feature Engineering & AI", title: "Detectando patrones sintácticos...", duration: 20000 },
                { phase: "Fase 2/2: Feature Engineering & AI", title: "Inferencia final de modelo híbrido...", duration: 25000 },
                { phase: "Finalizando", title: "Generando reporte de análisis...", duration: 2000 }
            ];

            // 2. LOGICA PRINCIPAL
            form.addEventListener('submit', async function (event) {
                event.preventDefault(); 

                if (fileInput.files.length === 0) {
                    alert("Por favor, selecciona un documento primero.");
                    return;
                }

                // Reiniciamos variables
                isServerDone = false;
                finalHtmlContent = "";

                // Mostrar UI
                overlay.classList.remove('hidden', 'opacity-0');
                overlay.classList.add('flex', 'opacity-100');
                setTimeout(() => {
                    processCard.classList.remove('scale-95');
                    processCard.classList.add('scale-100');
                }, 100);

                const formData = new FormData(form);

                // --- PROCESO EN PARALELO INTELIGENTE ---

                // A. Lanzamos la petición al servidor (SIN AWAIT para que no bloquee)
                // Usamos .then() para manejar la respuesta cuando llegue, sin importar cuándo sea
                const serverPromise = fetch('/ai-detect', {
                    method: 'POST',
                    body: formData
                })
                .then(async response => {
                    if (response.ok) {
                        finalHtmlContent = await response.text(); // Guardamos el HTML
                        isServerDone = true; // ¡AVISAMOS A LA ANIMACIÓN QUE TERMINAMOS!
                    } else {
                        throw new Error("Error en el servidor");
                    }
                })
                .catch(error => {
                    console.error(error);
                    alert("Ocurrió un error al procesar el archivo.");
                    location.reload();
                });

                // B. Lanzamos la animación y esperamos a que termine 
                // (La animación ahora sabe "acelerar" si isServerDone es true)
                await runProcessMonitor();

               if (!isServerDone) {
                    // Opcional: Avisar al usuario que se están ultimando detalles
                    if(progressText) progressText.textContent = "Finalizando procesamiento...";
                    
                    // Esperamos a que el fetch termine (ya sea éxito o error)
                    await serverPromise;
                }
                // --- CORRECCIÓN FIN ---

                // C. Una vez que la animación termina Y el servidor tiene los datos, mostramos el resultado
                if (isServerDone && finalHtmlContent) {
                    document.open();
                    document.write(finalHtmlContent);
                    document.close();
                }
            });

            async function runProcessMonitor() {
                stepsContainer.innerHTML = '';
                
                // Calcular duración total inicial para la barra de porcentaje
                let totalDuration = steps.reduce((acc, step) => acc + step.duration, 0);
                let currentTotalProgress = 0;

                // Render inicial de los pasos
                steps.forEach((step, index) => {
                    const stepHtml = `
                        <div id="step-${index}" class="step-item flex items-center p-3 rounded-lg border border-transparent opacity-50">
                            <div id="icon-${index}" class="flex-shrink-0 w-6 h-6 flex items-center justify-center mr-3">
                                <i class="far fa-circle text-gray-300 text-xl"></i>
                            </div>
                            <span class="text-sm font-medium text-gray-500">${step.title}</span>
                        </div>
                    `;
                    stepsContainer.insertAdjacentHTML('beforeend', stepHtml);
                });

                // --- BUCLE DE ANIMACIÓN ---
                for (let i = 0; i < steps.length; i++) {
                    const step = steps[i];
                    const stepEl = document.getElementById(`step-${i}`);
                    const iconEl = document.getElementById(`icon-${i}`);
                    
                    // Actualizar Título de Fase
                    if (processTitle.textContent !== step.phase) {
                        processTitle.textContent = step.phase;
                    }

                    // Auto Scroll
                    if(i > 0) stepsContainer.scrollTop = (i * 60) - 60; 

                    // Activar Estilos visuales del paso actual
                    stepEl.classList.remove('opacity-50', 'border-transparent');
                    stepEl.classList.add('bg-blue-50', 'border-blue-100', 'shadow-sm');
                    stepEl.querySelector('span').classList.remove('text-gray-500');
                    stepEl.querySelector('span').classList.add('text-primary', 'font-bold');
                    iconEl.innerHTML = `<i class="fas fa-spinner fa-spin text-primary text-xl"></i>`;
                    progressText.textContent = step.title;

                    // --- LÓGICA DE TIEMPO (Aquí ocurre la magia) ---
                    
                    // Si el servidor YA terminó, forzamos que este paso dure casi nada (5ms)
                    // Si no, usamos la duración normal definida en el array steps.
                    let stepDuration = isServerDone ? 50 : step.duration;
                    let intervalTime = isServerDone ? 10 : 100; 

                    const stepsCount = stepDuration / intervalTime;
                    
                    for(let t=0; t < stepsCount; t++) {
                        // VERIFICACIÓN CONSTANTE: 
                        // Si a mitad de un paso largo el servidor termina, rompemos el ciclo actual
                        // para pasar al siguiente paso inmediatamente en modo "rápido".
                        if (isServerDone && intervalTime === 100) {
                            break; 
                        }

                        await new Promise(r => setTimeout(r, intervalTime));
                        
                        // Solo actualizamos la barra si estamos en modo normal
                        // En modo rápido, la barra se llenará sola al final
                        if (!isServerDone) {
                            currentTotalProgress += intervalTime;
                            const percent = Math.min(Math.round((currentTotalProgress / totalDuration) * 100), 95); // Tope en 95% hasta finalizar
                            progressBar.style.width = `${percent}%`;
                            progressPercent.textContent = `${percent}%`;
                        }
                    }

                    // Completar el paso visualmente
                    stepEl.classList.remove('bg-blue-50', 'border-blue-100', 'shadow-sm');
                    stepEl.classList.add('opacity-60'); 
                    stepEl.querySelector('span').classList.remove('text-primary', 'font-bold');
                    stepEl.querySelector('span').classList.add('text-gray-700');
                    iconEl.innerHTML = `<i class="fas fa-check-circle text-green-500 text-xl"></i>`;
                }
                
                // Finalización Forzada Visual (100%)
                progressBar.style.width = `100%`;
                progressPercent.textContent = `100%`;
                progressText.textContent = "¡Análisis completado!";
                
                // Pequeña pausa para que el usuario vea el 100%
                await new Promise(r => setTimeout(r, 500));
            }
        });
    </script>
</body>
</html>
