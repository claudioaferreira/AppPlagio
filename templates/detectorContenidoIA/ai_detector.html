<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detector de Contenido AI - DECOPY AI</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#4361ee',
                        secondary: '#3a0ca3',
                        accent: '#7209b7',
                        light: '#f8f9fa',
                        dark: '#212529'
                    }
                }
            }
        }
    </script>

    <style>
        .step-item { transition: all 0.3s ease; }
        
        /* Personalización del scrollbar */
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #f1f1f1; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        
        #steps-container { scroll-behavior: smooth; }
    </style>
</head>

<body class="bg-gray-50 font-[Poppins]">

    <nav class="bg-white shadow-md py-4 relative z-10">
        <div class="container mx-auto px-4 flex justify-between items-center">
            <a href="{{ url_for('home') }}" class="flex items-center">
                <div class="bg-primary p-2 rounded-lg mr-3">
                    <i class="fas fa-robot text-white text-2xl"></i>
                </div>
                <span class="text-xl font-bold text-dark">DECOPY <span class="text-primary">AI</span></span>
            </a>
            <div class="flex items-center gap-4">
                <a href="{{ url_for('ai_detector_bp.ai_detector_page') }}" class="text-primary font-medium">Detector de IA</a>
            </div>
        </div>
    </nav>

    <section class="py-20 md:py-24 relative z-0">
        <div class="container mx-auto px-4">
            <div class="max-w-3xl mx-auto bg-white p-8 md:p-12 rounded-xl shadow-lg">
                <div class="text-center">
                    <h1 class="text-3xl md:text-4xl font-bold text-dark mb-4">Detector de Contenido AI</h1>
                    <p class="text-lg text-gray-600 mb-8">
                        Analiza un documento para determinar si fue escrito por un humano o una IA mediante análisis estilométrico avanzado.
                    </p>
                </div>

                <form id="aiForm" action="/ai-detect" method="post" enctype="multipart/form-data">
                    <label for="documento"
                        class="flex flex-col items-center justify-center w-full h-56 border-2 border-primary border-dashed rounded-lg cursor-pointer bg-light hover:bg-gray-100 transition relative">
                        
                        <div class="flex flex-col items-center justify-center pt-5 pb-6">
                            <i class="fas fa-cloud-upload-alt text-primary text-4xl mb-4"></i>
                            <p class="mb-2 text-sm text-gray-500"><span class="font-semibold">Haz clic para subir</span>
                                o arrastra y suelta</p>
                            <p class="text-xs text-gray-500">Archivos .txt, .pdf, .docx</p>
                            <p id="file-name" class="text-sm text-accent font-bold mt-2 text-center px-4"></p>
                        </div>
                        <input type="file" id="documento" name="documento" class="hidden" accept=".txt,.pdf,.docx" required />
                    </label>

                    <button type="submit"
                        class="w-full bg-primary hover:bg-secondary text-white font-bold py-3 px-6 rounded-lg transition duration-300 mt-6 text-lg shadow-lg hover:shadow-xl transform hover:-translate-y-1">
                        <i class="fas fa-search mr-2"></i> Analizar Texto
                    </button>
                </form>
            </div>
        </div>
    </section>

    <div id="process-overlay" class="fixed inset-0 z-50 hidden items-center justify-center bg-gray-900/90 backdrop-blur-sm transition-opacity duration-300 opacity-0">
    
        <div id="process-card" class="w-full max-w-lg bg-white rounded-2xl shadow-2xl overflow-hidden transform scale-95 transition-all duration-300 mx-4">
            
            <div class="bg-gray-50 px-6 py-4 border-b border-gray-100 flex justify-between items-center">
                <div>
                    <h3 class="text-lg font-bold text-dark" id="process-title">Analizando patrones...</h3>
                    <p class="text-xs text-gray-500 uppercase tracking-wider font-semibold">Decopy AI Engine</p>
                </div>
                <div class="h-10 w-10 bg-primary/10 rounded-full flex items-center justify-center">
                    <i class="fas fa-microchip text-primary text-xl animate-pulse"></i>
                </div>
            </div>
    
            <div class="p-6">
                <div class="mb-6">
                    <div class="flex justify-between mb-2 text-sm">
                        <span id="progress-text" class="text-gray-600 font-medium">Preparando entorno...</span>
                        <span id="progress-percent" class="text-primary font-bold">0%</span>
                    </div>
                    <div class="w-full bg-gray-200 rounded-full h-2.5 overflow-hidden">
                        <div id="progress-bar" class="bg-primary h-2.5 rounded-full transition-all duration-300 ease-out" style="width: 0%"></div>
                    </div>
                </div>
    
                <div id="steps-container" class="space-y-2 max-h-60 overflow-y-auto pr-2 custom-scrollbar">
                </div>
            </div>
    
            <div class="bg-gray-50 px-6 py-3 text-xs text-center text-gray-400 border-t border-gray-100">
                <i class="fas fa-lock mr-1"></i> Análisis privado y seguro
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const form = document.getElementById('aiForm');
            const fileInput = document.getElementById('documento');
            const fileNameDisplay = document.getElementById('file-name');
            
            // Elementos del Overlay
            const overlay = document.getElementById('process-overlay');
            const processCard = document.getElementById('process-card');
            const stepsContainer = document.getElementById('steps-container');
            const progressBar = document.getElementById('progress-bar');
            const progressPercent = document.getElementById('progress-percent');
            const progressText = document.getElementById('progress-text');
            const processTitle = document.getElementById('process-title');

            // 1. Mostrar nombre del archivo
            fileInput.addEventListener('change', function () {
                if (this.files && this.files.length > 0) {
                    fileNameDisplay.textContent = this.files[0].name;
                    this.parentElement.classList.add('border-accent', 'bg-purple-50');
                    this.parentElement.classList.remove('border-primary');
                } else {
                    fileNameDisplay.textContent = '';
                    this.parentElement.classList.remove('border-accent', 'bg-purple-50');
                    this.parentElement.classList.add('border-primary');
                }
            });

            // 2. Definición de Pasos (Escenario Unificado)
            // Diseñado para durar 2.5 min en total.
            // El paso 4 (Vectorización) termina aprox. en el segundo 75 (1.25 min), 
            // coincidiendo con el tiempo del Modelo 1.
            const steps = [
                { title: "Subiendo documento al servidor...", duration: 5000 },       // Cum: 5s
                { title: "Limpieza y normalización de texto...", duration: 10000 },   // Cum: 15s
                { title: "Análisis de estructura y sintaxis...", duration: 25000 },   // Cum: 40s
                { title: "Generando vectores numéricos TF-IDF...", duration: 35000 }, // Cum: 75s (Aquí terminaría el Modelo 1)
                { title: "Evaluación de complejidad semántica...", duration: 20000 },  // Cum: 95s
                { title: "Ejecutando predicción LightGBM...", duration: 45000 },      // Cum: 140s
                { title: "Verificando consistencia del lenguaje...", duration: 5000 },   // Cum: 145s
                { title: "Generando reporte final...", duration: 5000 }                 // Cum: 150s (2.5 min)
            ];

            // Variable de control global
            let isServerDone = false;
            let finalHtmlContent = "";

            // 3. Lógica Principal
            form.addEventListener('submit', async function (event) {
                event.preventDefault(); 

                if (fileInput.files.length === 0) {
                    alert("Por favor, selecciona un documento primero.");
                    return;
                }

                // Reiniciamos variables UI
                isServerDone = false;
                finalHtmlContent = "";
                processTitle.textContent = "Analizando Documento...";

                // Mostrar UI
                overlay.classList.remove('hidden');
                overlay.classList.add('flex');
                
                // Animación de entrada suave
                setTimeout(() => {
                    overlay.classList.remove('opacity-0');
                    processCard.classList.remove('scale-95');
                    processCard.classList.add('scale-100');
                }, 50);

                const formData = new FormData(form);

                // --- PROCESO EN PARALELO INTELIGENTE ---

                // A. Lanzamos la petición al servidor (Fetch asíncrono)
                const serverPromise = fetch('/ai-detect', {
                    method: 'POST',
                    body: formData
                })
                .then(async response => {
                    if (response.ok) {
                        finalHtmlContent = await response.text(); 
                        isServerDone = true; // ¡AVISAMOS A LA ANIMACIÓN QUE TERMINAMOS!
                    } else {
                        throw new Error("Error en el servidor");
                    }
                })
                .catch(error => {
                    console.error(error);
                    alert("Ocurrió un error al procesar el archivo. Intente nuevamente.");
                    location.reload();
                });

                // B. Lanzamos la animación y esperamos a que termine 
                await runProcessMonitor(steps);

                // Si la animación terminó pero el servidor sigue (caso raro), esperamos
                if (!isServerDone) {
                    if(progressText) progressText.textContent = "Finalizando procesamiento...";
                    await serverPromise;
                }

                // C. Mostrar resultado
                if (isServerDone && finalHtmlContent) {
                    document.open();
                    document.write(finalHtmlContent);
                    document.close();
                }
            });

            // Función del monitor de procesos
            async function runProcessMonitor(steps) {
                stepsContainer.innerHTML = '';
                
                let totalDuration = steps.reduce((acc, step) => acc + step.duration, 0);
                let currentTotalProgress = 0;

                // Render inicial de pasos (transparente)
                steps.forEach((step, index) => {
                    const stepHtml = `
                        <div id="step-${index}" class="step-item flex items-center p-2 rounded-lg border border-transparent opacity-40 transition-all duration-300">
                            <div id="icon-${index}" class="flex-shrink-0 w-6 h-6 flex items-center justify-center mr-3">
                                <i class="far fa-circle text-gray-400 text-sm"></i>
                            </div>
                            <span class="text-sm font-medium text-gray-600">${step.title}</span>
                        </div>
                    `;
                    stepsContainer.insertAdjacentHTML('beforeend', stepHtml);
                });

                // Bucle de animación paso a paso
                for (let i = 0; i < steps.length; i++) {
                    const step = steps[i];
                    const stepEl = document.getElementById(`step-${i}`);
                    const iconEl = document.getElementById(`icon-${i}`);
                    
                    // Activar paso visualmente
                    stepEl.classList.remove('opacity-40', 'border-transparent');
                    stepEl.classList.add('bg-blue-50', 'border-blue-100', 'shadow-sm', 'pl-4');
                    stepEl.querySelector('span').classList.add('text-primary', 'font-bold');
                    iconEl.innerHTML = `<i class="fas fa-spinner fa-spin text-primary"></i>`;
                    progressText.textContent = step.title;

                    // Auto Scroll
                    if(i > 1) stepsContainer.scrollTop = (i - 1) * 40; 

                    // LÓGICA DE TIEMPO (Aceleración si el servidor termina)
                    let stepDuration = isServerDone ? 50 : step.duration;
                    let intervalTime = isServerDone ? 10 : 100; 

                    const stepsCount = stepDuration / intervalTime;
                    
                    for(let t=0; t < stepsCount; t++) {
                        // Si el servidor termina en medio de un paso largo, romper para acelerar
                        if (isServerDone && intervalTime === 100) break; 

                        await new Promise(r => setTimeout(r, intervalTime));
                        
                        if (!isServerDone) {
                            currentTotalProgress += intervalTime;
                            const percent = Math.min(Math.round((currentTotalProgress / totalDuration) * 100), 95);
                            updateProgress(percent);
                        }
                    }

                    // Completar paso visualmente
                    stepEl.classList.remove('bg-blue-50', 'border-blue-100', 'shadow-sm', 'pl-4');
                    stepEl.classList.add('opacity-60'); 
                    stepEl.querySelector('span').classList.remove('text-primary', 'font-bold');
                    iconEl.innerHTML = `<i class="fas fa-check-circle text-green-500"></i>`;
                }
                
                // Finalización visual forzada (100%)
                updateProgress(100);
                progressText.textContent = "¡Análisis completado!";
                await new Promise(r => setTimeout(r, 500));
            }

            function updateProgress(percent) {
                progressBar.style.width = `${percent}%`;
                progressPercent.textContent = `${percent}%`;
            }
        });
    </script>
</body>
</html>
