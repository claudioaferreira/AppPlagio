<!DOCTYPE html>
<html>
<head>
    <title>Parafraseador de Texto</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <h1>Parafraseador de Texto</h1>
        <p>Ingresa un texto para obtener una versión parafraseada.</p>
        <form action="/paraphrase" method="post">
            <textarea name="original_text" rows="8" required placeholder="Escribe tu texto aquí..."></textarea>
            <input type="submit" value="Parafrasear">
        </form>
        <a href="/">Volver</a>
    </div>


        <script>
        // JavaScript para el contador de caracteres
        const textarea = document.getElementById('paraphrase-textarea');
        const counter = document.getElementById('char-counter');
        const maxLength = textarea.getAttribute('maxlength');

        textarea.addEventListener('input', () => {
            const currentLength = textarea.value.length;
            counter.textContent = `${currentLength}/${maxLength}`;
        });
    </script>
</body>
</html>
